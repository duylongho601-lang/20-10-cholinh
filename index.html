<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quà 20/10 siêu cấp 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffd6e8;--bg2:#ffa6cf;--ink:#8a1c5c;--accent:#ff1493;--card:#fff3f8;--paper:#fffaf0;--paperink:#7a1f52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a0a29;--bg2:#6b1650;--ink:#ffd3e8;--accent:#ff4fa8;--card:#5a1743}}
:root[data-theme="dark"]{--bg1:#3a0a29;--bg2:#6b1650;--ink:#ffd3e8;--accent:#ff4fa8;--card:#5a1743}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;font-family:Quicksand,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;color:var(--ink);background:var(--bg1);background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg1));background-size:200% 200%;animation:gr 12s ease infinite;touch-action:manipulation;-webkit-user-select:none;user-select:none}
@keyframes gr{50%{background-position:100% 100%}}
canvas{position:fixed;left:0;top:0;pointer-events:none}
#bg{z-index:0}#fx{z-index:50}
.scr{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;opacity:0;pointer-events:none;transform:scale(.94);transition:.5s}
.scr.on{opacity:1;pointer-events:auto;transform:none}
h1,h2{margin:0;line-height:1.25}
h1{font-family:Pacifico,cursive;font-size:clamp(28px,8vw,42px);color:var(--accent);text-shadow:0 3px 0 rgba(255,255,255,.5)}
h2{font-size:clamp(18px,5vw,24px)}
.step{font-size:13px;opacity:.7;letter-spacing:1px}
.pair{display:flex;align-items:center;gap:10px;font-size:28px}
.av{width:clamp(72px,22vw,100px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 18px rgba(255,20,147,.35);animation:bob 2.4s ease-in-out infinite}
.av+span+.av{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-8px)}}
.btn{border:0;border-radius:18px;padding:14px 26px;font:inherit;font-size:clamp(17px,5vw,22px);color:#fff;background:var(--accent);box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 22px rgba(255,20,147,.4);cursor:pointer;transition:transform .25s}
.btn:active{transform:translateY(3px) scale(.97)}
#no{position:fixed;z-index:6;background:#a9a9a9;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:left .28s,top .28s,transform .28s;white-space:nowrap}
#yes{animation:pul 1.2s ease-in-out infinite}
@keyframes pul{50%{filter:brightness(1.15)}}
#meter{width:min(70vw,280px);height:14px;border-radius:9px;background:rgba(255,255,255,.6);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fc3,#ff1493);transition:width .3s}
.fh{position:absolute;top:0;font-size:46px;animation:fall linear forwards;z-index:3;cursor:pointer}
@keyframes fall{from{transform:translateY(-60px) rotate(-10deg)}to{transform:translateY(112vh) rotate(14deg)}}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(94vw,440px)}
.card{aspect-ratio:1;perspective:600px}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.card.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f{display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--accent);border:3px solid #fff}
.b{transform:rotateY(180deg);border:3px solid #fff}
.b img{width:100%;height:100%;object-fit:cover}
.card.ok .b{box-shadow:0 0 14px 4px #ffd1e8}
.env{position:relative;width:min(70vw,280px);aspect-ratio:1.5;margin:14px 0;cursor:pointer;animation:bob 2s ease-in-out infinite}
.env>div{position:absolute}
.env .back{inset:0;background:#fff0f6;border:4px solid var(--accent);border-radius:14px;box-shadow:0 10px 24px rgba(255,20,147,.35)}
.env .note{left:9%;right:9%;top:12%;height:78%;background:#fff;border-radius:8px;transition:transform .8s .3s;display:flex;align-items:center;justify-content:center;font-size:30px}
.env .flap{left:0;right:0;top:0;height:58%;background:#ffb6c1;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;backface-visibility:hidden;z-index:2}
.env .seal{left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;z-index:3;transition:opacity .4s}
.env.open{animation:none}.env.open .flap{transform:rotateX(180deg)}.env.open .note{transform:translateY(-55%)}.env.open .seal{opacity:0}
.win{font-family:Pacifico,cursive;font-size:clamp(28px,8.5vw,44px);color:var(--accent);animation:pp 1.4s ease-in-out infinite}
@keyframes pp{50%{transform:scale(1.1)}}
#letter{position:fixed;inset:0;z-index:20;display:none;padding:max(env(safe-area-inset-top,0px),14px) 12px max(env(safe-area-inset-bottom,0px),14px);background:rgba(60,0,40,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#letter.on{display:flex}
.paper{margin:auto;width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--paperink);border:4px solid #ff69b4;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:rise .7s both}
@keyframes rise{from{transform:translateY(60px) scale(.9);opacity:0}}
.paper header{padding:14px;text-align:center;font-family:Pacifico,cursive;font-size:26px;color:#ff1493;border-bottom:2px dashed #ffb6c1}
.lb{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px}
.lb p{margin:0 0 16px;font-size:17px;line-height:1.6;opacity:0;transform:translateY(16px);transition:.8s}
.lb .in2{opacity:1;transform:none}
.pols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:6px 10px 20px;opacity:0;transition:.8s}
.pol{background:#fff;padding:6px 6px 8px;box-shadow:0 5px 14px rgba(0,0,0,.25);font-size:12px;text-align:center;color:var(--paperink);transform:rotate(var(--r))}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;margin-bottom:5px}
.paper footer{padding:10px;display:flex;gap:10px;justify-content:center;border-top:2px dashed #ffb6c1}
.paper footer .btn{padding:10px 18px;font-size:16px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-90px);z-index:60;background:#fff;color:#c2185b;padding:10px 18px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:.4s;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<div id="toast"></div>

<section class="scr on" id="s1">
  <div class="pair"><img class="av" data-i="0" alt=""><span>💞</span><img class="av" data-i="1" alt=""></div>
  <h1>Hế lô bé iu của anh!</h1>
  <h2>Nay sinh nhật + 20/10</h2>
  <h2>Em muốn nhận quà hông?</h2>
  <button class="btn" id="yes">Dạ cóooo 💖</button>
  <button class="btn" id="no">Chê, hông cần</button>
</section>

<section class="scr" id="s2">
  <div class="step">MÀN 2/3</div>
  <h2>Hứng 10 trái tim cho anh nè!<br>🐭 = x2 điểm</h2>
  <div id="meter"><i></i></div>
  <div id="cnt" class="step">0 / 10</div>
</section>

<section class="scr" id="s3">
  <div class="step">MÀN 3/3</div>
  <h2>Lật hình tìm cặp giống nhau nha 🐭</h2>
  <div class="cards" id="cards"></div>
  <div class="step" id="mv">Số lượt: 0</div>
</section>

<section class="scr" id="s4">
  <div class="win">Hihii BIẾT NGAY MÀ 💖</div>
  <h2>Chúc vợ yêu sinh nhật &amp; 20/10 cực vui!</h2>
  <div class="env" id="env"><div class="back"></div><div class="note">💌</div><div class="flap"></div><div class="seal">❤️</div></div>
  <h2 id="hint">Chạm vào thư để đọc nhaaa 👆</h2>
</section>

<div id="letter">
  <div class="paper">
    <header>Thư gửi Linh 💌</header>
    <div class="lb" id="lb"></div>
    <footer><button class="btn" id="again">Chơi lại 🔁</button><button class="btn" id="close">Đóng thư</button></footer>
  </div>
</div>

const CAU=["Chê, hông cần","Lì vậy má?","Bấm nhầm hả?","Vẫn cố chấp =))","Bước đi pa!","Hông là hông","Bấm chậm vại","Lẹ lên?","Ảo ma vậy","Đã có đi mà T.T","Cho tui xin 1 vé Dạ","Pleeaassee","Éo thể tin dc","Bất lực...","Aaaaaaaa"];
const LETTER=[
"Hihi, chúc mừng bé đã pass thử thách bấm nút khi cái nút kia chạy trốn như ma đuổi 😂 Anh biết ngay là bé sẽ bấm “Dạ có” mà, không thể khác được.",
"Hôm nay vừa sinh nhật vừa 20/10 nên anh chúc bé x2 luôn nha: xinh x2, vui x2, tiền về x2 và yêu anh x2 nữa 😆",
"Cảm ơn bé đã xuất hiện trong đời anh. Từ khi có bé, ngày nào của anh cũng có vibe tích cực, deadline có đập vào mặt vẫn cười được. Nhìn lại mấy tấm hình tụi mình nè, hai đứa đeo filter chuột mà cute hơn cả chuột Mickey luôn 🐭",
"PICS",
"Chúc heo béo của anh tuổi mới luôn healing, không stress, không drama, đi shopping không bao giờ hết tiền (anh trả, anh chịu 🤣). Chỉ gặp green flag thôi, mà green flag to nhất chắc là anh rồi nha.",
"Nếu một ngày bé buồn hay mệt, nhớ là anh luôn ở đây nha: có vai để tựa, có tai để nghe bé kể drama 3 tiếng không phàn nàn, và có cái ôm thật chặt luôn sẵn sàng. No cap, no ghost!",
"Anh không giỏi nói lời sến súa, nhưng anh hứa sẽ luôn chiều bé, bảo vệ bé và làm fan cứng số 1 của bé. Không cần vote, không cần stream, vẫn ở đây ủng hộ bé dài dài.",
"Tóm lại là: anh thương bé nhiều hơn cả wifi nhà anh luôn, không lag, không mất kết nối. Happy birthday + Happy 20/10 nha vợ yêu của anh!!! Muah muah 💋",
"Của bé, Anh 💖<br><small>P/S: cái web này anh tự code trên điện thoại đó, mất mấy đêm debug mới xong 😭 (có lỗi thì tha cho anh nha)</small>"];
const CAP=["Hai con chuột 🐭","Chuột bé xinh","Gọi video là hết buồn","Nhìn xinh hong chịu nổi"];
const $=id=>document.getElementById(id);
/* ===== effects ===== */
const bg=$("bg"),fx=$("fx"),bc=bg.getContext("2d"),fc=fx.getContext("2d");
let W,H,dpr=Math.min(devicePixelRatio||1,2),ps=[];
function rs(){W=innerWidth;H=innerHeight;for(const c of[bg,fx]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";c.getContext("2d").setTransform(dpr,0,0,dpr,0,0)}}
addEventListener("resize",rs);rs();
function heart(c,x,y,s,col,a){c.save();c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x,y-s*.1,x-s,y-s*.1,x-s,y+s*.4);c.bezierCurveTo(x-s,y+s*.9,x-s*.2,y+s*1.1,x,y+s*1.35);c.bezierCurveTo(x+s*.2,y+s*1.1,x+s,y+s*.9,x+s,y+s*.4);c.bezierCurveTo(x+s,y-s*.1,x,y-s*.1,x,y+s*.35);c.fill();c.restore()}
const COL=["#ff69b4","#ff1493","#ffb6c1","#ff8fc3","#ffd1e8","#ffe066","#c77dff"];
const hs=Array.from({length:26},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:6+Math.random()*14,v:.4+Math.random()*1.1,ph:Math.random()*6,c:COL[Math.random()*4|0]}));
function burst(x,y,n,conf){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=2+Math.random()*(conf?7:4);ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(conf?4:1),g:.12,l:50+Math.random()*40,s:conf?6+Math.random()*6:5+Math.random()*7,c:COL[Math.random()*COL.length|0],k:conf?(Math.random()<.5?"r":"h"):"h",r:Math.random()*6})}}
function confetti(){for(let i=0;i<4;i++)setTimeout(()=>burst(W*(.15+.23*i),H*.35,45,1),i*220)}
function loop(t){bc.clearRect(0,0,W,H);for(const h of hs){h.y-=h.v;h.x+=Math.sin(t/900+h.ph)*.5;if(h.y<-40){h.y=H+40;h.x=Math.random()*W}heart(bc,h.x,h.y,h.s,h.c,.55)}
fc.clearRect(0,0,W,H);ps=ps.filter(p=>p.l>0);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;const a=Math.min(1,p.l/25);if(p.k==="h")heart(fc,p.x,p.y,p.s,p.c,a);else{fc.save();fc.globalAlpha=a;fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.r+p.l/9);fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore()}}
requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener("pointerdown",e=>burst(e.clientX,e.clientY,7));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),2200)}
function go(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));$("no").style.display=id==="s1"?"":"none"}
document.querySelectorAll(".av").forEach(i=>i.src=IM[i.dataset.i]);
/* ===== màn 1: nút Không chạy trốn ===== */
const yes=$("yes"),no=$("no");let fl=0;
function place(x,y){no.style.left=x+"px";no.style.top=y+"px"}
function initNo(){const r=yes.getBoundingClientRect();place(Math.max(12,r.left+r.width/2-no.offsetWidth/2),r.bottom+18)}
function flee(){const y=yes.getBoundingClientRect(),w=no.offsetWidth,h=no.offsetHeight;let ok=false;
for(let i=0;i<60&&!ok;i++){const x=12+Math.random()*Math.max(1,W-w-24),t=H*.35+Math.random()*Math.max(1,H*.6-h);
if(x+w+16<y.left||x-16>y.right||t+h+16<y.top||t-16>y.bottom){place(x,t);ok=true}}
if(!ok)place(W-w-12,H-h-24);
fl++;no.textContent=CAU[fl%CAU.length];yes.style.transform="scale("+Math.min(1.5,1+fl*.04)+")";
no.style.transform="scale("+(.6+Math.random()*.8)+")"}
no.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();flee()});
no.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")flee()});
no.addEventListener("click",e=>e.stopPropagation());
yes.addEventListener("click",()=>{confetti();toast("Yeee 🎉 nhưng chưa xong đâu nha!");setTimeout(()=>{go("s2");startCatch()},900)});
addEventListener("load",initNo);setTimeout(initNo,400);
/* ===== màn 2: hứng tim ===== */
let got=0,sp;
function startCatch(){got=0;upd();sp=setInterval(mk,600)}
function upd(){$("cnt").textContent=Math.min(got,10)+" / 10";$("meter").firstElementChild.style.width=Math.min(100,got*10)+"%"}
function mk(){const e=document.createElement("div");e.className="fh";const m=Math.random()<.2;e.textContent=m?"🐭":"💖";e.style.left=Math.random()*(W-56)+"px";e.style.animationDuration=(2.8+Math.random()*1.6)+"s";
e.addEventListener("pointerdown",ev=>{ev.stopPropagation();const r=e.getBoundingClientRect();burst(r.left+20,r.top+20,12);e.remove();got+=m?2:1;upd();
if(got>=10){clearInterval(sp);document.querySelectorAll(".fh").forEach(x=>x.remove());confetti();toast("Giỏi quá trời 😍 qua màn cuối nè");setTimeout(()=>{go("s3");startMem()},900)}});
e.addEventListener("animationend",()=>e.remove());$("s2").appendChild(e)}
/* ===== màn 3: lật hình ===== */
let first=null,lock=false,mv=0,pairs=0;
function startMem(){const ids=[0,1,2,3,0,1,2,3].sort(()=>Math.random()-.5),box=$("cards");box.innerHTML="";mv=0;pairs=0;first=null;
ids.forEach(id=>{const c=document.createElement("div");c.className="card";c.dataset.id=id;c.innerHTML='<div class="in"><div class="f">💖</div><div class="b"><img alt=""></div></div>';c.querySelector("img").src=IM[id];c.addEventListener("click",()=>pick(c));box.appendChild(c)})}
function pick(c){if(lock||c.classList.contains("flip"))return;c.classList.add("flip");
if(!first){first=c;return}mv++;$("mv").textContent="Số lượt: "+mv;
if(first.dataset.id===c.dataset.id){first.classList.add("ok");c.classList.add("ok");const r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,14);first=null;
if(++pairs===4){confetti();setTimeout(()=>{go("s4");confetti()},1000)}}
else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove("flip");c.classList.remove("flip");lock=false},750)}}
/* ===== màn 4: phong bì + thư ===== */
$("env").addEventListener("click",()=>{const e=$("env");if(e.classList.contains("open"))return;e.classList.add("open");$("hint").textContent="Đang mở thư... 💞";confetti();setTimeout(openLetter,1300)});
function openLetter(){const lb=$("lb");lb.innerHTML="";lb.scrollTop=0;
if(NGAY_YEU){const d=Math.floor((Date.now()-new Date(NGAY_YEU))/864e5);if(d>0)LETTER.unshift("Mình yêu nhau được "+d+" ngày rồi nè 💞")}
const seen=new Set();
LETTER.forEach(t=>{if(seen.has(t))return;seen.add(t);
if(t==="PICS"){const g=document.createElement("div");g.className="pols";[0,1,2,3].forEach(i=>{const p=document.createElement("div");p.className="pol";p.style.setProperty("--r",[-4,3,3,-3][i]+"deg");p.innerHTML='<img alt=""><span>'+CAP[i]+"</span>";p.querySelector("img").src=IM[i];g.appendChild(p)});lb.appendChild(g);g.dataset.rv=1;return}
const p=document.createElement("p");p.innerHTML=t;lb.appendChild(p)});
$("letter").classList.add("on");
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in2");x.target.style.opacity=1;x.target.style.transform="none";io.unobserve(x.target)}}),{root:lb,threshold:.15});
setTimeout(()=>lb.querySelectorAll("p,.pols").forEach(el=>io.observe(el)),500);
burst(W/2,H*.4,40,1)}
$("close").addEventListener("click",()=>{$("letter").classList.remove("on");$("env").classList.remove("open");$("hint").textContent="Chạm vào thư để đọc lại nha 👆"});
$("again").addEventListener("click",()=>location.reload());
</script>
